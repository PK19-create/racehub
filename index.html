<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Hub is verhuisd</title>
<meta http-equiv="refresh" content="3;url=https://racehub.peterkolder.nl/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1218;color:#e8eef4;font-family:system-ui,sans-serif;text-align:center}
  .card{max-width:420px;padding:40px 28px}
  .logo{font-weight:800;font-size:28px;letter-spacing:1px}
  .logo span{color:#FFD900}
  p{color:#8a99ab;line-height:1.5}
  a.btn{display:inline-block;margin-top:10px;background:#FFD900;color:#111;font-weight:700;padding:14px 26px;border-radius:10px;text-decoration:none;font-size:17px}
  button.ghost{margin-top:22px;background:none;border:1px solid #2a3644;color:#8a99ab;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">RACE<span>HUB</span></div>
  <p>De Race Hub is verhuisd naar een eigen adres met automatische synchronisatie. Je wordt binnen enkele seconden doorgestuurd.</p>
  <a class="btn" href="https://racehub.peterkolder.nl/">Ga naar racehub.peterkolder.nl</a>
  <p style="font-size:12px;margin-top:26px">Zet het nieuwe adres op je beginscherm; deze oude pagina verdwijnt op termijn.</p>
  <button class="ghost" id="oldData">&#11015; Oude lokale data van dit apparaat downloaden</button>
</div>
<script>
  const raw=localStorage.getItem('racehub-v1');
  if(raw){
    const b=document.getElementById('oldData');
    b.style.display='inline-block';
    b.onclick=()=>{
      const blob=new Blob([raw],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='racehub-oude-data-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click(); a.remove();
    };
  }
</script>
</body>
</html>
